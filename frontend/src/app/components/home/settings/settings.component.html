<div class="settings">
  <h3>General</h3>
  <div class="toggle-setting">
    <div>
      Swap <span class="colour-primary">primary</span> and
      <span class="colour-accent">accent</span> colours
    </div>
    <label class="switch">
      <input
        type="checkbox"
        [checked]="isSwapped()"
        (change)="onThemeSwap($event)"
      />
      <span class="slider"></span>
    </label>
  </div>
  <h3>Chat</h3>
  <div class="toggle-setting">
    <div>Enable chat</div>
    <label class="switch">
      <input
        type="checkbox"
        [checked]="settings.chatEnabled()"
        (change)="onToggleChat()"
      />
      <span class="slider"></span>
    </label>
  </div>
  <div class="toggle-setting">
    <div>Close chat after sending a message</div>
    <label class="switch">
      <input
        type="checkbox"
        [checked]="settings.closeChatOnSend()"
        (change)="settings.toggleCloseChatOnSend()"
      />
      <span class="slider"></span>
    </label>
  </div>
  <div class="toggle-setting">
    <div>Play a click noise when a message is sent in chat</div>
    <label class="switch">
      <input
        type="checkbox"
        [checked]="settings.playChatNotif()"
        (change)="settings.togglePlayChatNotif()"
      />
      <span class="slider"></span>
    </label>
  </div>
  <div class="toggle-setting">
    <div>Play a bell noise when you are pinged in chat</div>
    <label class="switch">
      <input
        type="checkbox"
        [checked]="settings.playPingNotif()"
        (change)="settings.togglePlayPingNotif()"
      />
      <span class="slider"></span>
    </label>
  </div>
</div>
