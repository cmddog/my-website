@if (message().kind === "chat") {
  <p class="minecraft-regular" [class.grey]="message().deleted">
    <span class="minecraft-regular position-relative"
      ><{{ message().sender }}><span id="tooltip" class="minecraft-regular">{{
        time()
      }}</span></span
    >&nbsp;{{ message().content }}
  </p>
} @else {
  <p [class]="message().color" class="minecraft-regular">
    [Server] {{ message().text }}
  </p>
}
